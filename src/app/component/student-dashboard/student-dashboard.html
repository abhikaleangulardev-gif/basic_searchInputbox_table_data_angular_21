<div class="container my-5">
    <div class="row">
        <div class="col-sm-12 mb-4 d-flex justify-content-between">

            <input type="text" name="" id="" class="form-control" placeholder="Enter Your Name....."
                (input)="onInputStudentName($event)" appFocus>

            <select class="form-control ms-3" aria-label="studentlist" (change)="onChangeStdNum($event)">
                <option>select Option..</option>
                @for (number of studentsnumbers; track $index) {
                <option [value]="number">{{number}}</option>
                }
            </select>
        </div>
        <div class="col-sm-12">
            <div class="card">
                <div class="card-body">
                    <table class="table table-bordered table-dark text-center">
                        <thead>
                            <tr>
                                <th scope="col">Sr No.</th>
                                <th scope="col">Id No.</th>
                                <th scope="col">Std Name</th>
                                <th scope="col">Std Marks</th>
                                <th scope="col">Std City</th>
                                <th scope="col">Std Branch</th>
                                <th scope="col">Std College Name</th>
                            </tr>
                        </thead>

                        <tbody>
                            @for (std of myStudentDetails; track $index) {
                            <tr>
                                <td scope="row">{{$index + 1}}</td>
                                <td scope="row">{{std.id}}</td>
                                <td scope="row">{{std.name}}</td>
                                <td scope="row">{{std.marks}}</td>
                                <td scope="row">{{std.city}}</td>
                                <td scope="row">{{std.branch}}</td>
                                <td scope="row">{{std.collegeName}}</td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
